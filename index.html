<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>선생님 신청하기 - Day11</title>
<style>
  :root {
    --ink: #183027;
    --muted: #64736c;
    --paper: #f7f5ed;
    --panel: #fffdf6;
    --line: #d7dbcf;
    --green: #257357;
    --green-soft: #dff0e7;
    --orange: #dd7b35;
  }
  * { box-sizing: border-box; }
  body { font-family: "Apple SD Gothic Neo", Pretendard, sans-serif; color: var(--ink); background: var(--paper); max-width: 480px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.lead { color: var(--muted); font-size: 14px; margin: 0 0 18px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 22px; box-shadow: 0 8px 25px rgba(24,48,39,.06); }
  label { display: block; margin: 14px 0 4px; font-weight: 700; font-size: 14px; }
  label .opt { font-weight: 400; color: var(--muted); font-size: 12px; }
  input, select, textarea { width: 100%; padding: 10px 12px; border: 1px solid #bfc9bf; border-radius: 8px; font-size: 15px; background: #fff; color: var(--ink); font-family: inherit; }
  textarea { resize: vertical; }
  input:focus, select:focus, textarea:focus { outline: 3px solid var(--green-soft); border-color: var(--green); }
  button { margin-top: 18px; width: 100%; padding: 12px 22px; background: var(--orange); color: #fff; border: 0; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; }
  button:hover { filter: brightness(.96); }
  button:disabled { opacity: .55; cursor: wait; }
  #done { display: none; color: var(--green); font-weight: 700; margin-top: 14px; }
</style>
</head>
<body>
<h1>오후 테니스 수업 강사 신청</h1>
<p class="lead">테니스 지도 경험과 가능한 시간을 알려주세요.</p>
<div class="card">
<form id="f">
  <label for="name">이름</label>
  <input id="name" name="name" type="text" required maxlength="40">
  <label for="contact">연락처 <span class="opt">(이메일 또는 전화번호)</span></label>
  <input id="contact" name="contact" type="text" required maxlength="60">
  <label for="beginner">초급자 지도 가능 여부</label>
  <select id="beginner" name="beginner" required>
    <option value="">선택해주세요</option>
    <option value="yes">예, 가능합니다</option>
    <option value="no">아니오</option>
  </select>
  <label for="certification">테니스 코치 자격증</label>
  <select id="certification" name="certification" required>
    <option value="">선택해주세요</option>
    <option value="yes">보유하고 있습니다</option>
    <option value="no">보유하지 않습니다</option>
  </select>
  <label for="level">지도 가능 수준</label>
  <select id="level" name="level" required>
    <option value="">선택해주세요</option>
    <option value="beginner">초급자만</option>
    <option value="beginner-intermediate">초급~중급</option>
    <option value="all">모든 수준</option>
  </select>
  <label for="notes">추가 정보 <span class="opt">(선택)</span></label>
  <textarea id="notes" name="notes" rows="3" maxlength="300"></textarea>
  <button type="submit">신청서 제출하기</button>
</form>
<p id="done">신청서가 접수됐습니다. 감사합니다.</p>
</div>
<script>
document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const button = e.target.querySelector("button");
  const body = {
    name: document.getElementById("name").value,
    contact: document.getElementById("contact").value,
    beginner: document.getElementById("beginner").value,
    certification: document.getElementById("certification").value,
    level: document.getElementById("level").value,
    notes: document.getElementById("notes").value
  };
  button.disabled = true;
  try {
    const res = await fetch("/api/submit", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    if (res.ok) {
      document.getElementById("f").style.display = "none";
      document.getElementById("done").style.display = "block";
    } else {
      alert("접수 실패 - 화면을 캡처해 채팅에 올려 주세요 (" + res.status + ")");
    }
  } finally {
    button.disabled = false;
  }
});
</script>
</body>
</html>
